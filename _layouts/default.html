  document.getElementById("toggle-decommissioned").addEventListener("click", function (e) {
    e.preventDefault();

    document.querySelectorAll(".thumb.decommissioned").forEach(el => {
      el.style.display = el.style.display === "none" ? "block" : "none";
    });
  });
</script>
